services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vee_care_control
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: vee_care_control
      DB_USERNAME: root
      DB_PASSWORD:
      CONTROL_DB_HOST: mysql
      CONTROL_DB_DATABASE: vee_care_control
      TENANT_PLATFORM_DOMAIN: vee-care.test
      TENANT_DB_DRIVER: mysql
      TENANT_DB_HOST: mysql
      TENANT_DB_USERNAME: root
      TENANT_DB_PASSWORD:
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: log
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    volumes:
      - ./backend:/var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000

  frontend:
    build:
      context: ./frontend
    # Intentionally no VITE_API_BASE_URL override: the SPA derives its API
    # base from window.location.hostname (src/services/apiBase.ts), so each
    # tenant host (e.g. http://hospital-one.vee-care.test:5173) reaches its
    # own API Host (http://hospital-one.vee-care.test:8000/api) and the backend
    # ResolveTenant resolver stays authoritative. Setting VITE_API_BASE_URL here
    # pinned every tenant to http://127.0.0.1:8000/api (Host=127.0.0.1 => platform
    # context) and broke tenant authentication. Production deployments may still
    # set VITE_API_BASE_URL explicitly where the API lives on a dedicated host.
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: npm run dev -- --host 0.0.0.0

volumes:
  mysql-data:
